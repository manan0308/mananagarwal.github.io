[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/a-year-of-battles-my-fathers-fight-against-brain-tumor"
  to = "/navigating-cancer-a-caregivers-journal/"
  status = 301
  force = true

[[redirects]]
  from = "/a-year-of-battles-my-fathers-fight-against-brain-tumor/"
  to = "/navigating-cancer-a-caregivers-journal/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "all"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
